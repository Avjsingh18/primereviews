name: Security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reviewflow
          POSTGRES_PASSWORD: security-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOCAL_DATABASE_PORT: 5432
      PGPASSWORD: security-test-only
      REVIEWFLOW_LOCAL_BACKEND: "false"
      AI_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: https://app.example
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.fixture.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: fixture-service-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test:security
      - run: npm run test:security:production
      - run: npm run test:security:db
      - run: npm run build
      - name: Verify production-mode HTTP responses
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3100/login > /dev/null; then break; fi
            sleep 1
          done
          npm run test:security:http
      - run: npm run check:secrets
